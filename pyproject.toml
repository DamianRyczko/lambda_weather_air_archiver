[project]
name = "lambda-weather-air-archiver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DamianRyczko", email = "damianryczko2003@gmail.com" }
]
requires-python = ">=3.11"
